# Notizie del blog (decise da Marco il 22/10/2026): due volte al giorno, dalle fonti ufficiali e dai siti di notizie.
# script/notizie.mjs scrive con Workers AI (tetto «notizie» in script/cf-modelli.mjs) e pubblica solo ciò che supera
# il controllo dei fatti fatto in codice. Il commit fa ripubblicare il sito da Cloudflare.
name: Notizie

on:
  schedule:
    # 24/10/2026: cinque giri invece di due, per stare sul pezzo (il primo subito dopo la mezzanotte UTC, quando si azzera il tetto)
    - cron: '20 0 * * *'
    - cron: '40 6 * * *'
    - cron: '40 11 * * *'
    - cron: '40 15 * * *'
    - cron: '40 20 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'Quante notizie al massimo'
        default: '3'

permissions:
  contents: write

concurrency:
  group: notizie
  cancel-in-progress: false

jobs:
  notizie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Scrivi le notizie
        env:
          BOZZE_KEY: ${{ secrets.BOZZE_KEY }}
          # 26/10/2026: se il tetto di Workers AI è finito scrive Groq gratis (script/bozze.mjs)
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node script/notizie.mjs --max "${{ inputs.max || '3' }}"
      - name: Commit delle notizie
        run: |
          git add contenuti/notizie
          if git diff --cached --quiet; then echo "Nessuna notizia nuova"; exit 0; fi
          git config user.name "freellmarena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Notizie $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 10))
          done
