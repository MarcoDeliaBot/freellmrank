# Ogni lunedì un articolo del blog in bozza (script/bozza-blog.mjs): ramo «bozza/<slug>» e issue «bozza» da approvare.
# Il testo lo scrive Workers AI attraverso /api/scrivi (segreto BOZZE_KEY), sulla quota gratis del sito. Niente si pubblica senza Marco.
name: Bozza blog

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bozza-blog
  cancel-in-progress: false

jobs:
  bozza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node script/bozza-blog.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOZZE_KEY: ${{ secrets.BOZZE_KEY }}
