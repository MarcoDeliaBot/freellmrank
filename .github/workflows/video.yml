# Dopo ogni aggiornamento dei dati: video verticali (stile /brag, approvato da Marco il 20/10/2026), in inglese e in italiano:
# il modello nuovo più recente ogni volta, il report settimanale la domenica, la scheda video della settimana il mercoledì.
# Dal 21/10/2026 con voce (Piper, gratis, gira qui), sottotitoli e chiusura «link in bio».
# Si pubblica come release di GitHub "video-<nome>" con <nome>.mp4, <nome>.jpg e <nome>.json (titolo, descrizione, tag,
# testo da condividere). n8n la carica su YouTube (n8n/video-youtube.json). Un video già fatto non si rifà.
name: Video

on:
  workflow_run:
    workflows: ['Aggiorna dati']
    types: [completed]
  workflow_dispatch:
    inputs:
      settimana:
        description: 'Fai anche il report settimanale'
        type: boolean
        default: false
      gpu:
        description: 'Fai anche il video della scheda video della settimana'
        type: boolean
        default: false
      solo_social:
        description: 'Rifai solo le bozze social di un video già pubblicato (nuovo, settimana o gpu)'
        type: string
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  video:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strumenti (browser senza finestra, caratteri, numpy, voce Piper)
        run: |
          pip install playwright numpy imageio-ffmpeg piper-tts==1.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-urw-base35 fonts-noto-core
      # le voci (circa 180 MB) si scaricano da Hugging Face una volta e poi restano nella cache
      - uses: actions/cache@v4
        with:
          path: video/voci
          key: voci-piper-lessac-high-paola-medium
      - name: Video e release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BOZZE_KEY: ${{ secrets.BOZZE_KEY }}
        run: |
          node script/brag/genera.mjs
          if [ -n "${{ inputs.solo_social }}" ]; then node script/bozze-social.mjs "${{ inputs.solo_social }}"; exit 0; fi
          tipi="nuovo"
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.settimana }}" = "true" ]; then tipi="$tipi settimana"; fi
          if [ "$(date -u +%u)" = "3" ] || [ "${{ inputs.gpu }}" = "true" ]; then tipi="$tipi gpu"; fi
          for tipo in $tipi; do
            for lingua in "" "-it"; do
              v="$tipo$lingua"
              nome=$(python -c "import json; print(json.load(open('video/brag/info-$v.json', encoding='utf-8'))['nome'])")
              if gh release view "video-$nome" >/dev/null 2>&1; then echo "Già fatto: $nome"; continue; fi
              python script/brag/registra.py video "$v"
              d="video/brag/brag-output-$v"
              cp "$d/brag.mp4" "$d/$nome.mp4"; cp "$d/brag.jpg" "$d/$nome.jpg"; cp "video/brag/info-$v.json" "$d/$nome.json"
              titolo=$(python -c "import json; print(json.load(open('$d/$nome.json', encoding='utf-8'))['titolo'])")
              gh release create "video-$nome" "$d/$nome.mp4" "$d/$nome.jpg" "$d/$nome.json" --title "$titolo" --notes-file "$d/share-copy.txt" --latest=false
              echo "Pubblicato: $nome"
              # bozze dei post social (issue «bozza»), solo per la versione inglese: se non riescono, il video resta comunque
              if [ -z "$lingua" ]; then node script/bozze-social.mjs "$tipo" || echo "Bozze social non riuscite per $nome"; fi
            done
          done
