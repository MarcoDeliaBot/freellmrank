# Dopo ogni aggiornamento dei dati: video verticali (stile /brag, approvato da Marco il 20/10/2026), solo in inglese
# (deciso da Marco il 22/10/2026: YouTube traduce titoli, sottotitoli e audio, come fanno i canali che segue):
# il modello nuovo più recente ogni volta, il report settimanale la domenica, la scheda video della settimana il mercoledì,
# e la domenica anche il video lungo orizzontale della settimana (script/brag/lungo.mjs).
# Con voce (Piper, gratis, gira qui), sottotitoli e chiusura «link in bio».
# Si pubblica come release di GitHub "video-<nome>" con <nome>.mp4, <nome>.jpg, <nome>.srt (sottotitoli col testo esatto
# della voce) e <nome>.json (titolo, descrizione, tag, testo da condividere e «localizzazioni»: titolo e descrizione
# in it, es, de, fr, pt). n8n la carica su YouTube (n8n/video-youtube.json). Un video già fatto non si rifà.
# Dal 22/10/2026 anche il video lungo di ogni modello nuovo (script/brag/modello.mjs, copione di Workers AI con controllo
# dei fatti): fino a 2 per corsa, il più recente non ancora raccontato.
# Ogni video ha il suo post nel blog (deciso da Marco il 22/10/2026), pubblicato da solo se passa il controllo dei fatti
# (script/video-post.mjs: ogni numero detto o scritto deve stare nelle scene, costruite dai dati); poi commit e push.
name: Video

on:
  workflow_run:
    workflows: ['Aggiorna dati']
    types: [completed]
  workflow_dispatch:
    inputs:
      settimana:
        description: 'Fai anche il report settimanale'
        type: boolean
        default: false
      gpu:
        description: 'Fai anche il video della scheda video della settimana'
        type: boolean
        default: false
      lungo:
        description: 'Fai anche il video lungo della settimana (orizzontale, 2-3 minuti)'
        type: boolean
        default: false
      solo_social:
        description: 'Rifai solo le bozze social di un video già pubblicato (nuovo, settimana o gpu)'
        type: string
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  video:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strumenti (browser senza finestra, caratteri, numpy, voce Piper)
        run: |
          pip install playwright numpy imageio-ffmpeg piper-tts==1.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-urw-base35 fonts-noto-core
      # le voci (circa 180 MB) si scaricano da Hugging Face una volta e poi restano nella cache
      - uses: actions/cache@v4
        with:
          path: video/voci
          key: voci-piper-lessac-high-paola-medium
      - name: Video e release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BOZZE_KEY: ${{ secrets.BOZZE_KEY }}
        run: |
          node script/brag/genera.mjs
          node script/brag/lungo.mjs
          if [ -n "${{ inputs.solo_social }}" ]; then node script/bozze-social.mjs "${{ inputs.solo_social }}"; exit 0; fi
          tipi="nuovo"
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.settimana }}" = "true" ]; then tipi="$tipi settimana"; fi
          if [ "$(date -u +%u)" = "3" ] || [ "${{ inputs.gpu }}" = "true" ]; then tipi="$tipi gpu"; fi
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.lungo }}" = "true" ]; then tipi="$tipi lungo"; fi
          for tipo in $tipi; do
            for lingua in ""; do
              v="$tipo$lingua"
              nome=$(python -c "import json; print(json.load(open('video/brag/info-$v.json', encoding='utf-8'))['nome'])")
              if gh release view "video-$nome" >/dev/null 2>&1; then echo "Già fatto: $nome"; continue; fi
              python script/brag/registra.py video "$v"
              d="video/brag/brag-output-$v"
              cp "$d/brag.mp4" "$d/$nome.mp4"; cp "$d/brag.jpg" "$d/$nome.jpg"; cp "$d/brag.srt" "$d/$nome.srt"; cp "video/brag/info-$v.json" "$d/$nome.json"
              titolo=$(python -c "import json; print(json.load(open('$d/$nome.json', encoding='utf-8'))['titolo'])")
              gh release create "video-$nome" "$d/$nome.mp4" "$d/$nome.jpg" "$d/$nome.srt" "$d/$nome.json" --title "$titolo" --notes-file "$d/share-copy.txt" --latest=false
              echo "Pubblicato: $nome"
              # post del blog: solo se ogni numero torna con i dati; se no il video resta, il post no
              node script/video-post.mjs "video/brag/info-$v.json" "$d/brag.jpg" "video/brag/scena-$v.html" "video-$nome" || echo "Post non scritto per $nome: controllo dei fatti non superato"
              # bozze dei post social (issue «bozza»), solo per la versione inglese: se non riescono, il video resta comunque
              if [ "$tipo" != "lungo" ]; then node script/bozze-social.mjs "$tipo" || echo "Bozze social non riuscite per $nome"; fi
            done
          done
          # video lunghi dei modelli nuovi: fino a 2 a corsa (la lista delle release dice quali sono già fatti)
          gh release list -L 400 --json tagName -q '.[].tagName' > video/brag/fatti.txt
          for k in 1 2; do
            rm -f video/brag/info-modello.json
            BRAG_FATTI=video/brag/fatti.txt node script/brag/modello.mjs || { echo "Copione del modello non riuscito"; break; }
            [ -f video/brag/info-modello.json ] || break
            nome=$(python -c "import json; print(json.load(open('video/brag/info-modello.json', encoding='utf-8'))['nome'])")
            if gh release view "video-$nome" >/dev/null 2>&1; then echo "Già fatto: $nome"; break; fi
            python script/brag/registra.py video modello
            d="video/brag/brag-output-modello"
            cp "$d/brag.mp4" "$d/$nome.mp4"; cp "$d/brag.jpg" "$d/$nome.jpg"; cp "$d/brag.srt" "$d/$nome.srt"; cp video/brag/info-modello.json "$d/$nome.json"
            titolo=$(python -c "import json; print(json.load(open('$d/$nome.json', encoding='utf-8'))['titolo'])")
            gh release create "video-$nome" "$d/$nome.mp4" "$d/$nome.jpg" "$d/$nome.srt" "$d/$nome.json" --title "$titolo" --notes-file "$d/share-copy.txt" --latest=false
            echo "Pubblicato: $nome"
            node script/video-post.mjs video/brag/info-modello.json "$d/brag.jpg" video/brag/scena-modello.html "video-$nome" video/brag/fonti-modello.txt || echo "Post non scritto per $nome: controllo dei fatti non superato"
            node script/bozze-social.mjs modello || echo "Bozze social non riuscite per $nome"
            echo "video-$nome" >> video/brag/fatti.txt
          done
      - name: Post del blog dei video (commit)
        run: |
          git add contenuti/video
          if git diff --cached --quiet; then echo "Nessun post nuovo"; exit 0; fi
          git config user.name "freellmarena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Post dei video $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 10))
          done
