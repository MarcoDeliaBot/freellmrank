# Dopo ogni aggiornamento dei dati: video verticale (stile /brag, approvato da Marco il 20/10/2026) del modello nuovo
# più recente e, la domenica, del report settimanale. Si pubblica come release di GitHub "video-<nome>" con
# <nome>.mp4, <nome>.jpg e <nome>.json (titolo, descrizione, tag, testo da condividere). n8n la carica su YouTube
# (n8n/video-youtube.json). Un video già fatto non si rifà: la release con lo stesso nome esiste già.
name: Video

on:
  workflow_run:
    workflows: ['Aggiorna dati']
    types: [completed]
  workflow_dispatch:
    inputs:
      settimana:
        description: 'Fai anche il report settimanale'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  video:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strumenti (browser senza finestra, caratteri, numpy)
        run: |
          pip install playwright numpy imageio-ffmpeg
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-urw-base35 fonts-noto-core
      - name: Video e release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BOZZE_KEY: ${{ secrets.BOZZE_KEY }}
        run: |
          node script/brag/genera.mjs
          tipi="nuovo"
          if [ "$(date -u +%u)" = "7" ] || [ "${{ inputs.settimana }}" = "true" ]; then tipi="nuovo settimana"; fi
          for tipo in $tipi; do
            nome=$(python -c "import json; print(json.load(open('video/brag/info-$tipo.json', encoding='utf-8'))['nome'])")
            if gh release view "video-$nome" >/dev/null 2>&1; then echo "Già fatto: $nome"; continue; fi
            python script/brag/registra.py video "$tipo"
            d="video/brag/brag-output-$tipo"
            cp "$d/brag.mp4" "$d/$nome.mp4"; cp "$d/brag.jpg" "$d/$nome.jpg"; cp "video/brag/info-$tipo.json" "$d/$nome.json"
            titolo=$(python -c "import json; print(json.load(open('$d/$nome.json', encoding='utf-8'))['titolo'])")
            gh release create "video-$nome" "$d/$nome.mp4" "$d/$nome.jpg" "$d/$nome.json" --title "$titolo" --notes-file "$d/share-copy.txt" --latest=false
            echo "Pubblicato: $nome"
            # bozze dei post social per questo video (issue «bozza»): se non riescono, il video resta comunque
            node script/bozze-social.mjs "$tipo" || echo "Bozze social non riuscite per $nome"
          done
