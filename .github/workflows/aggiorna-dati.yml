# Ogni notte: nuovi voti Arena, nuovi modelli gratis OpenRouter, nuove dimensioni da Hugging Face.
# Se i dati cambiano, fa un commit: Cloudflare Pages vede il push e ripubblica il sito.
name: Aggiorna dati

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 15 * * *' # seconda corsa: GitHub a volte salta o ritarda quella notturna
  workflow_dispatch:

permissions:
  contents: write

# la sveglia di n8n e la corsa programmata possono partire vicine: una alla volta, mai annullate
concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  dati:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run dati
      - name: Conserva e verifica le pagine pubblicate
        run: |
          node script/aggiorna-pagine-pubblicate.mjs
          npm run build
      # frasi nuove del sito (modelli nuovi, articoli approvati) tradotte nelle altre lingue, sulla quota gratis del sito
      - name: Traduci le frasi nuove
        continue-on-error: true
        env:
          BOZZE_KEY: ${{ secrets.BOZZE_KEY }}
        run: node script/traduci-mancanti.mjs --max 16
      - name: Commit se i dati sono cambiati
        id: commit
        run: |
          git add sito/data.json dati/pesi.json dati/architettura.json dati/piccoli.json dati/nuovi.json dati/decisioni.json dati/decisioni-licenze.json dati/audio.json dati/musica.json dati/3d.json sito/history.json traduzioni/*.json dati/pagine-pubblicate.json dati/pagine-archivio.json
          if git diff --cached --quiet; then echo "Nessun cambiamento"; exit 0; fi
          git config user.name "freellmarena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dati aggiornati $(date -u +%F)"
          # il 21/10 il push fu rifiutato perché durante i 6 minuti di corsa main era andato avanti:
          # ci si rimette in coda alle modifiche nuove e si riprova (sui file dei dati vince questa corsa)
          for i in 1 2 3 4 5; do
            git push && break
            [ "$i" = 5 ] && exit 1
            sleep $((i * 10))
            git pull --rebase -X theirs origin main
            node script/aggiorna-pagine-pubblicate.mjs --recupera
            git add dati/pagine-pubblicate.json dati/pagine-archivio.json
            git diff --cached --quiet || git commit --amend --no-edit
          done
          echo "spinto=si" >> "$GITHUB_OUTPUT"
      # Cloudflare ripubblica in 1-3 minuti; poi si avvisano i motori di ricerca (IndexNow, gratis)
      - name: Avvisa i motori di ricerca
        if: steps.commit.outputs.spinto == 'si'
        continue-on-error: true
        run: |
          sleep 240
          node script/indexnow.mjs
